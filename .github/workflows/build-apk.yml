name: Build & Publish Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'apk/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Setup Expo & Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Android Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📁 Copy Versioned APK to apk/ folder
        id: versioning
        run: |
          VERSION=$(node -p "require('./app.json').expo.version || '1.0.0'")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/SafeVault-v${VERSION}.apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/SafeVault-latest.apk
          ls -la apk/

      - name: 🚀 Commit & Push APK to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/
          git commit -m "chore(release): update SafeVault-v${{ env.APP_VERSION }}.apk [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: 📤 Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeVault-Release-APK
          path: apk/SafeVault-v${{ env.APP_VERSION }}.apk
          if-no-files-found: warn
          retention-days: 30
